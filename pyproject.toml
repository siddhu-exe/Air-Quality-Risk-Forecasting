[project]
name = "delhi-air-quality-risk-forecasting"
version = "0.3.0"
description = "Delhi air-quality forecasting and live risk pipeline"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["*.md", "venv", "node_modules", "frontend", "local_pg_data", "kaggle", "Og Data", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ANN"]
ignore = [
    "E501",  # line length is the formatter's job
    "E402",  # scripts put the repo root on sys.path before importing src.*
    "B905",  # zip() strictness is not worth a churn commit
    "B007",  # unused loop variable
    "ANN401",  # Any is accepted where a duck-typed store or stub is passed
]

[tool.ruff.lint.per-file-ignores]
# Phase-era research scripts keep their original shape; src/live has no relaxations, and annotations (ANN) are enforced there only.
"tests/*" = ["B011", "E702", "E731", "F841", "ANN"]
"etl/*" = ["E701", "E702", "F841", "F401", "ANN"]
"profiling/*" = ["W191", "E101", "E701", "F841", "ANN"]
"portfolio/*" = ["F841", "ANN"]
"reports/*" = ["W291", "F841", "ANN"]
"scripts/*" = ["ANN"]
"scripts/checks/*" = ["E701", "E702", "F841", "ANN"]
"backend/*" = ["ANN"]
"src/eda/*" = ["F841", "ANN"]
"src/analysis/*" = ["F841", "ANN"]
"src/evaluation/*" = ["ANN"]
"src/features/*" = ["ANN"]
"src/models/*" = ["ANN"]
"src/models/phase_*" = ["B023", "F841", "E731", "ANN"]
"src/models/cost_*" = ["F841", "ANN"]
"src/models/train_ml_baseline.py" = ["F841", "ANN"]
