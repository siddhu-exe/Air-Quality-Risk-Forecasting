repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
        exclude: '\.(parquet|joblib|png|pdf|svg|txt)$'
      - id: trailing-whitespace
        exclude: '\.(md|parquet|joblib|png|pdf|svg|txt)$'
      - id: check-added-large-files
        args: [--maxkb=5000]
      - id: check-merge-conflict
      - id: check-yaml
  - repo: local
    hooks:
      - id: no-env-file
        name: refuse to commit .env files
        entry: ".env files must not be committed (use .env.example)"
        language: fail
        files: '(^|/)\.env($|\.(local|production))'
