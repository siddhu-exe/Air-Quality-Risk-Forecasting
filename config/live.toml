# Live pipeline settings. Environment variables override these (LIVE_SOURCE, LIVE_FALLBACK, LIVE_LOOKBACK_HOURS,
# LIVE_WEATHER_FILL, LIVE_WEATHER_DISPLAY, LIVE_ALLOW_UNVERIFIED), so the source can be switched from the GitHub Actions UI or a repo
# variable without a code change.
[ingest]
source = "openaq"          # "openaq" | "data_gov_in"
fallback = ""              # optional second source, used only if the primary fails or returns nothing fresh
lookback_hours = 6         # most recent hours (re)fetched each run; upserts make overlap harmless
stale_after_hours = 3      # a station whose newest reading is older than this is stale; a run with no fresh station fails
weather_display = "open-meteo"  # store Open-Meteo values in empty solar/ITO weather cells (weather_source/qc_flags say so), for display
weather_fill = "none"      # what the forecast models see: "none" masks every filled cell. The D1 audit showed filling HURT the 1h/6h models
                           # on validation (6h with OpenAQ: +0.258 MAE filled vs +0.066 left empty); "open-meteo" would feed them back in
allow_unverified = false   # a source whose hour convention is not verified against real data is refused when false
