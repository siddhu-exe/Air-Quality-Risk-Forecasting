# Forecast job, hourly at minute 25 (after the :10 ingest). It starts producing forecasts by itself the first hour a station's data is
# fresh; while the source lags it records status 'stale' in job_runs and stays green (the freshness gate skips stale stations, nothing is
# written). Real faults (a model hash mismatch, an exception, every station skipped for another reason) still turn it red.
# Reads history with the writer role, verifies the model hashes (config/live_model_hashes.json), writes aq.forecasts.
# Scheduled runs write; a manual run is a dry run unless you untick the box.
name: forecast

on:
  schedule:
    - cron: "25 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (read-only role, nothing written)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: forecast
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-forecast.txt
      - run: pip install -r requirements-forecast.txt
      - name: Forecast
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_READONLY: ${{ secrets.DATABASE_URL_READONLY }}
          LIVE_WEATHER_FILL: ${{ vars.LIVE_WEATHER_FILL }}
        run: python -m src.live.forecast ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '--dry-run' || '' }}
