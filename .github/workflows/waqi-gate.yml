# Weekly verdict on whether WAQI may be a fallback live source for PM2.5/PM10 (ADR 0009). Reads aq.shadow_readings and aq.live_readings,
# applies the gate in src/live/shadow_compare.py and posts the result to the GitHub issue titled "WAQI fallback gate, weekly result
# [waqi-gate]" (opened on the first run, commented on after that). A FAIL is a result, not a broken job: the run stays green.
# It changes nothing else: no forecast, API or ingest reads the shadow table.
name: waqi-gate

on:
  schedule:
    - cron: "30 4 * * 1" # Mondays 04:30 UTC (10:00 IST)
  workflow_dispatch:

permissions:
  contents: read
  issues: write # open or comment on the gate issue

concurrency:
  group: waqi-gate
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-live.txt
      - run: pip install -r requirements-live.txt
      - name: Evaluate the gate and post the result
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python -m src.live.shadow_compare --gate --issue
