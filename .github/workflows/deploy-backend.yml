# Test, build, push to GHCR, and roll the Container App to the new image. Authenticates to Azure with OIDC (no stored password).
# Setup (resources, federated credential, secrets and variables): docs/TIER_3/AZURE_SETUP.md. Not run yet: needs those steps first.
name: deploy-backend

# MANUAL ONLY until the first deploy has been done by hand. TODO(auto): then add, under `on:`,
#   push:
#     branches: [main]
#     paths: ["backend/**", "reports/modeling/live_retrain/window_update_baseline.csv",
#             "reports/modeling/live_pm25/pm25_forecast_metrics.csv", "reports/live/replay_*.csv", ".dockerignore"]
# and change the deploy job's `if` to `github.event_name == 'push' || inputs.deploy`.
on:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Roll the Container App after the image is built (off = build and push only)"
        type: boolean
        default: false

concurrency:
  group: deploy-backend
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/delhi-air-api

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt pytest==9.1.1 httpx==0.28.1
      - run: python -m pytest -q tests/test_backend_service.py tests/test_backend_api.py

  image:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    # a manual run deploys only when asked
    if: inputs.deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      id-token: write # OIDC token for azure/login
      contents: read
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Roll the Container App to the new image
        env:
          # Origins the browser may call the API from (CORS): scheme + host, no path or trailing slash, comma-separated.
          # Repository variable FRONTEND_ORIGIN (Settings > Secrets and variables > Actions > Variables). Set on every deploy so
          # the running config always matches it.
          FRONTEND_ORIGIN: ${{ vars.FRONTEND_ORIGIN }}
          # DATABASE_URL_READONLY is bound to the Container App secret `database-url-readonly` (AZURE_SETUP.md step 5) on every deploy,
          # so the env var name the API reads cannot drift back to the lowercase secret name.
        run: |
          if [ -z "$FRONTEND_ORIGIN" ]; then
            echo "Repository variable FRONTEND_ORIGIN is not set (Settings > Secrets and variables > Actions > Variables)." >&2
            exit 1
          fi
          az extension add --name containerapp --upgrade --only-show-errors
          az containerapp update --name "${{ vars.AZURE_CONTAINER_APP }}" --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --image "${{ env.IMAGE }}:${{ needs.image.outputs.tag }}" \
            --set-env-vars "FRONTEND_ORIGIN=${FRONTEND_ORIGIN}" "DATABASE_URL_READONLY=secretref:database-url-readonly" \
            --only-show-errors
          az containerapp ingress update --name "${{ vars.AZURE_CONTAINER_APP }}" --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --target-port 8000 --only-show-errors
      - name: Smoke test
        run: |
          fqdn=$(az containerapp show --name "${{ vars.AZURE_CONTAINER_APP }}" --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --query properties.configuration.ingress.fqdn -o tsv)
          # a cold start from zero replicas can take a minute
          for attempt in 1 2 3 4 5 6 7 8; do
            if curl -fsS --max-time 30 "https://${fqdn}/api/v1/health" | tee /dev/stderr | grep -q '"status"'; then exit 0; fi
            sleep 15
          done
          echo "health endpoint did not answer" >&2
          exit 1
