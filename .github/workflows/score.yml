# Nightly scoring of matured forecasts at 20:40 UTC (02:10 Asia/Kolkata, after the day's last forecast has matured). Scores forecasts whose
# target hour is over against the stored actuals, refreshes aq.skill_rolling, and opens or refreshes a GitHub issue when an alert rule in
# src/live/score.py fires (skill below zero for 7 days, a job failing 3 runs in a row; 'stale' runs never count). With nothing forecast
# yet it scores nothing and stays green. Scheduled runs are live runs with issues on; a manual run chooses.
name: score

on:
  schedule:
    - cron: "40 20 * * *"
  workflow_dispatch:
    inputs:
      run_type:
        description: "Which forecasts to score"
        type: choice
        options: [live, replay]
        default: live
      open_issues:
        description: "Open or refresh GitHub issues for alerts (live only)"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: score
  cancel-in-progress: false

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-forecast.txt
      - run: pip install -r requirements-forecast.txt
      - name: Score
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python -m src.live.score --run-type ${{ inputs.run_type || 'live' }} ${{ (github.event_name == 'schedule' || inputs.open_issues) && '--issues' || '' }}
