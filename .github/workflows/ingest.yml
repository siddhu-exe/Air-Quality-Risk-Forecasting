# Live ingest, hourly at minute 10 (not :00, to avoid the top-of-the-hour queue). Source comes from config/live.toml; override without a
# commit via the repository variable LIVE_SOURCE (Settings > Secrets and variables > Actions > Variables) or the "source" input.
# OpenAQ is primary. While it lags behind, every run still writes whatever new hours it has (idempotent upserts) and records the lag in
# job_runs.details; the forecast job refuses stale data on its own, so nothing is forecast until the data is fresh.
# The forecast cron stays OFF until a source has been under 3 h old for 24 hours straight (see docs/TIER_3/README.md).
name: ingest

on:
  schedule:
    - cron: "10 * * * *"
  workflow_dispatch:
    inputs:
      source:
        description: "Live source for this run (empty = config/live.toml or the LIVE_SOURCE variable)"
        type: choice
        options: ["", openaq, data_gov_in]
        default: ""

permissions:
  contents: read

concurrency:
  group: ingest
  cancel-in-progress: false      # never kill a run that is mid-write; the next one waits

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-live.txt
      - run: pip install -r requirements-live.txt
      - name: Ingest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATA_GOV_IN_API_KEY: ${{ secrets.DATA_GOV_IN_API_KEY }}
          OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
          LIVE_SOURCE: ${{ inputs.source || vars.LIVE_SOURCE }}
          LIVE_FALLBACK: ${{ vars.LIVE_FALLBACK }}
          LIVE_WEATHER_FILL: ${{ vars.LIVE_WEATHER_FILL }}
          LIVE_WEATHER_DISPLAY: ${{ vars.LIVE_WEATHER_DISPLAY }}
        run: python -m src.live.ingest
