# Live ingest, MANUAL ONLY for now. Source comes from config/live.toml; override without a commit via the repository
# variable LIVE_SOURCE (Settings > Secrets and variables > Actions > Variables) or the "source" input when dispatching.
# TODO(cron): the hourly schedule is added in the same commit that switches to a source the probe has shown to be fresh
# from a runner. While OpenAQ is stale an hourly run would only be a red run, so no `schedule:` trigger yet. Planned:
#   schedule:
#     - cron: "10 * * * *"   # minute 10, not :00, to avoid the top-of-the-hour queue
name: ingest

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Live source for this run (empty = config/live.toml or the LIVE_SOURCE variable)"
        type: choice
        options: ["", openaq, data_gov_in]
        default: ""

permissions:
  contents: read

concurrency:
  group: ingest
  cancel-in-progress: false      # never kill a run that is mid-write; the next one waits

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-live.txt
      - run: pip install -r requirements-live.txt
      - name: Ingest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATA_GOV_IN_API_KEY: ${{ secrets.DATA_GOV_IN_API_KEY }}
          OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
          LIVE_SOURCE: ${{ inputs.source || vars.LIVE_SOURCE }}
          LIVE_FALLBACK: ${{ vars.LIVE_FALLBACK }}
          LIVE_WEATHER_FILL: ${{ vars.LIVE_WEATHER_FILL }}
        run: python -m src.live.ingest
